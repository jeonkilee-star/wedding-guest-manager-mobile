<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1B5E45">
  <title>결혼식 하객 관리</title>
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22결혼식%20하객%20관리%22,%22short_name%22:%22하객관리%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20192%20192%27%3E%3Crect%20fill=%27%232D3E50%27%20width=%27192%27%20height=%27192%27/%3E%3Ctext%20x=%2796%27%20y=%27140%27%20font-size=%27120%27%20fill=%27%23fff%27%20text-anchor=%27middle%27%3E💍%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}],%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23fff%22,%22theme_color%22:%22%232D3E50%22}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+CJK+KR:wght@400;500;700&display=swap">
  <style>
    :root {
      --primary: #1B5E45;
      --accent: #D4AF37;
      --success: #059669;
      --warning: #D97706;
      --danger: #DC2626;
      --bg: linear-gradient(135deg, #f5f5f0 0%, #e8f4f0 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #2D3E50;
      --text-muted: #6B7280;
      --border: #D4C5B9;
      --safe-bottom: max(16px, env(safe-area-inset-bottom));
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #A8D5BA;
        --accent: #D4AF37;
        --bg: linear-gradient(135deg, #1a2f28 0%, #0f1f1a 100%);
        --card-bg: rgba(45, 62, 80, 0.95);
        --text: #F3F4F6;
        --text-muted: #9CA3AF;
        --border: #4B5563;
      }
    }

    :root[data-theme="dark"] {
      --primary: #A8D5BA;
      --accent: #D4AF37;
      --bg: linear-gradient(135deg, #1a2f28 0%, #0f1f1a 100%);
      --card-bg: rgba(45, 62, 80, 0.95);
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --border: #4B5563;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans CJK KR", sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .header {
      background: linear-gradient(135deg, rgba(27, 94, 69, 0.08) 0%, rgba(212, 175, 55, 0.06) 100%);
      border-bottom: 2px solid var(--border);
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 1px;
    }

    .tabs {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 8px;
      gap: 4px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .input-section {
      background: var(--card-bg);
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 12px;
    }

    .contributor-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .contributor-btn {
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .contributor-btn.active {
      background: linear-gradient(135deg, var(--primary) 0%, #0f3d2e 100%);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(27, 94, 69, 0.25);
    }

    .contributor-btn:active {
      transform: scale(0.95);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--bg);
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
    }

    .count-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .count-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .count-btn:active {
      transform: scale(0.9);
    }

    .count-display {
      flex: 1;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }

    .save-btn {
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, #0f3d2e 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(27, 94, 69, 0.2);
      letter-spacing: 0.5px;
    }

    .save-btn:active {
      background: linear-gradient(135deg, var(--accent) 0%, #d4af37 100%);
      color: var(--primary);
      transform: scale(0.97);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.3);
    }

    .save-btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .stat {
      padding: 12px;
      background: var(--bg);
      border-radius: 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .list-tabs {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 8px;
      gap: 4px;
    }

    .list-tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .list-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .list-section {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: var(--safe-bottom);
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      background: var(--bg);
      padding: 10px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    tr:hover {
      background: var(--bg);
    }

    .status-select {
      border: 1px solid var(--border);
      background: transparent;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .delete-btn {
      padding: 4px 8px;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .delete-btn:active {
      background: var(--danger);
      color: white;
    }

    @media (max-width: 600px) {
      th, td {
        font-size: 12px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>💍 결혼식 하객 관리</h1>
    </div>

    <div class="tabs">
      <button class="tab active" data-side="groom">신랑측</button>
      <button class="tab" data-side="bride">신부측</button>
    </div>

    <div class="content">
      <div class="input-section">
        <div class="section-title">입력자 선택</div>
        <div class="contributor-buttons" id="contributorButtons"></div>

        <div class="form-group">
          <label for="nameInput">이름 (개인 기록용, 공유 안 됨)</label>
          <input type="text" id="nameInput" placeholder="예: 친구 3명, 큰아버지댁 등">
        </div>

        <div class="form-group">
          <label>인원수</label>
          <div class="count-control">
            <button class="count-btn" onclick="decreaseCount()">−</button>
            <div class="count-display" id="countDisplay">1</div>
            <button class="count-btn" onclick="increaseCount()">+</button>
          </div>
        </div>

        <button class="save-btn" id="saveBtn" onclick="saveSubmission()">추가하기</button>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">총 인원</div>
          <div class="stat-value" id="totalCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">제출 건수</div>
          <div class="stat-value" id="submitCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">참석</div>
          <div class="stat-value" id="attendedCount" style="color: var(--success);">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">미응답</div>
          <div class="stat-value" id="pendingCount" style="color: var(--warning);">0</div>
        </div>
      </div>

      <div class="list-tabs">
        <button class="list-tab active" data-view="public">공개 목록</button>
        <button class="list-tab" data-view="personal">내 제출</button>
      </div>

      <div class="list-section" id="publicSection">
        <div id="emptyStatePublic" class="empty-state">
          <div class="empty-state-icon">📋</div>
          <div>아직 제출한 내용이 없습니다</div>
        </div>
        <table id="publicTable" style="display: none;">
          <thead>
            <tr>
              <th>작성자</th>
              <th>인원</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="list-section" id="personalSection" style="display: none;">
        <div id="emptyStatePersonal" class="empty-state">
          <div class="empty-state-icon">📝</div>
          <div>아직 제출한 내용이 없습니다</div>
        </div>
        <table id="personalTable" style="display: none;">
          <thead>
            <tr>
              <th>역할</th>
              <th>인원</th>
              <th>메모</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    </div>
  </div>

  <script>
    const CONTRIBUTORS = {
      groom: ['신랑', '아버지', '어머니', '동생'],
      bride: ['신부', '아버지', '어머니', '언니']
    };

    let currentSide = 'groom';
    let selectedContributor = null;
    let count = 1;
    let submissions = [];
    let personalSubmissions = [];
    let db = null;
    let currentView = 'public';

    async function init() {
      db = await claude.use("db");
      renderContributors();
      await loadSubmissions();
      renderStats();
      document.getElementById('nameInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') saveSubmission();
      });
    }

    function renderContributors() {
      const buttons = document.getElementById('contributorButtons');
      buttons.innerHTML = CONTRIBUTORS[currentSide].map(name => `
        <button class="contributor-btn ${selectedContributor === name ? 'active' : ''}"
                onclick="selectContributor('${name}')">
          ${name}
        </button>
      `).join('');
    }

    function selectContributor(name) {
      selectedContributor = name;
      renderContributors();
    }

    function increaseCount() {
      count++;
      document.getElementById('countDisplay').textContent = count;
    }

    function decreaseCount() {
      if (count > 1) {
        count--;
        document.getElementById('countDisplay').textContent = count;
      }
    }

    async function saveSubmission() {
      if (!selectedContributor) {
        alert('입력자를 선택해주세요.');
        return;
      }

      const name = document.getElementById('nameInput').value.trim();
      const contributor = `${currentSide === 'groom' ? '신랑측' : '신부측'} ${selectedContributor}`;
      const submissionId = `sub_${Date.now()}`;

      if (db) {
        try {
          // 공개 데이터: 모두가 볼 수 있음 (이름 없음)
          await db.collection("wedding/submissions").set(submissionId, {
            contributor,
            count,
            status: 'pending',
            createdAt: Date.now()
          });

          // 개인 기록: 입력자만 볼 수 있음 (이름 포함)
          await db.collection("data/users/me/wedding-submissions").set(submissionId, {
            contributor,
            count,
            personalNote: name,
            createdAt: Date.now()
          });
        } catch (e) {
          console.error("DB save failed:", e);
          const submission = {
            id: submissionId,
            contributor,
            count,
            status: 'pending',
            personalNote: name,
            createdAt: Date.now()
          };
          submissions.push(submission);
          personalSubmissions.push(submission);
          saveToLocalStorage();
        }
      } else {
        const submission = {
          id: submissionId,
          contributor,
          count,
          status: 'pending',
          personalNote: name,
          createdAt: Date.now()
        };
        submissions.push(submission);
        personalSubmissions.push(submission);
        saveToLocalStorage();
      }

      document.getElementById('nameInput').value = '';
      count = 1;
      document.getElementById('countDisplay').textContent = '1';
      document.getElementById('nameInput').focus();

      await loadSubmissions();
      renderStats();
    }

    async function loadSubmissions() {
      if (db) {
        try {
          // 공개 목록 로드
          const publicResult = await db.collection("wedding/submissions").orderBy({ field: "createdAt", direction: "desc" }).get();
          submissions = publicResult.docs.map(doc => ({ id: doc.id, ...doc.data }));

          // 개인 제출 로드
          const personalResult = await db.collection("data/users/me/wedding-submissions").orderBy({ field: "createdAt", direction: "desc" }).get();
          personalSubmissions = personalResult.docs.map(doc => ({ id: doc.id, ...doc.data }));

          // 실시간 구독
          db.collection("wedding/submissions").onSnapshot((snapshot) => {
            submissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data }));
            renderList();
            renderStats();
          });

          db.collection("data/users/me/wedding-submissions").onSnapshot((snapshot) => {
            personalSubmissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data }));
            renderList();
          });
        } catch (e) {
          console.log("DB not available");
          loadFromLocalStorage();
        }
      } else {
        loadFromLocalStorage();
      }
      renderList();
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem("wedding-submissions");
      if (saved) {
        try {
          submissions = JSON.parse(saved);
        } catch (e) {
          submissions = [];
        }
      }
    }

    function saveToLocalStorage() {
      localStorage.setItem("wedding-submissions", JSON.stringify(submissions));
    }

    function renderList() {
      if (currentView === 'public') {
        renderPublicList();
      } else {
        renderPersonalList();
      }
    }

    function renderPublicList() {
      const tbody = document.querySelector('#publicTable tbody');
      const emptyState = document.getElementById('emptyStatePublic');
      const table = document.getElementById('publicTable');

      if (submissions.length === 0) {
        emptyState.style.display = 'block';
        table.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      table.style.display = 'table';

      tbody.innerHTML = submissions.map(s => `
        <tr>
          <td>${s.contributor}</td>
          <td style="font-weight: 700; font-size: 14px;">${s.count}명</td>
          <td>
            <select class="status-select" onchange="updateStatus('${s.id}', this.value)">
              <option value="pending" ${s.status === 'pending' ? 'selected' : ''}>미응답</option>
              <option value="attended" ${s.status === 'attended' ? 'selected' : ''}>참석</option>
              <option value="declined" ${s.status === 'declined' ? 'selected' : ''}>불참</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    function renderPersonalList() {
      const tbody = document.querySelector('#personalTable tbody');
      const emptyState = document.getElementById('emptyStatePersonal');
      const table = document.getElementById('personalTable');

      if (personalSubmissions.length === 0) {
        emptyState.style.display = 'block';
        table.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      table.style.display = 'table';

      const groupTotals = {};
      personalSubmissions.forEach(s => {
        groupTotals[s.contributor] = (groupTotals[s.contributor] || 0) + s.count;
      });

      tbody.innerHTML = personalSubmissions.map(s => `
        <tr>
          <td>${s.contributor} <span style="color: var(--text-muted); font-size: 12px;">(총 ${groupTotals[s.contributor]}명)</span></td>
          <td style="font-weight: 700; font-size: 14px;">${s.count}명</td>
          <td style="font-size: 12px; color: var(--text-muted);">${s.personalNote || '—'}</td>
          <td>
            <button class="delete-btn" onclick="deletePersonalSubmission('${s.id}')">삭제</button>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id, status) {
      const submission = submissions.find(s => s.id === id);
      if (!submission) return;

      if (db) {
        try {
          await db.collection("wedding/submissions").update(id, { status });
        } catch (e) {
          console.error("Update failed:", e);
        }
      } else {
        submission.status = status;
        saveToLocalStorage();
        renderList();
        renderStats();
      }
    }

    async function deleteSubmission(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;

      submissions = submissions.filter(s => s.id !== id);

      if (db) {
        try {
          await db.collection("wedding/submissions").delete(id);
        } catch (e) {
          console.error("Delete failed:", e);
        }
      } else {
        saveToLocalStorage();
        renderList();
        renderStats();
      }
    }

    async function deletePersonalSubmission(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;

      personalSubmissions = personalSubmissions.filter(s => s.id !== id);

      if (db) {
        try {
          await db.collection("wedding/submissions").delete(id);
          await db.collection("data/users/me/wedding-submissions").delete(id).catch(() => {});
        } catch (e) {
          console.error("Delete failed:", e);
        }
      } else {
        saveToLocalStorage();
        renderList();
        renderStats();
      }
    }

    function renderStats() {
      const total = submissions.reduce((sum, s) => sum + s.count, 0);
      const attended = submissions.filter(s => s.status === 'attended').reduce((sum, s) => sum + s.count, 0);
      const pending = submissions.filter(s => s.status === 'pending').reduce((sum, s) => sum + s.count, 0);

      document.getElementById('totalCount').textContent = total;
      document.getElementById('submitCount').textContent = submissions.length;
      document.getElementById('attendedCount').textContent = attended;
      document.getElementById('pendingCount').textContent = pending;
    }

    // Tab switching (신랑측/신부측)
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentSide = tab.dataset.side;
        selectedContributor = null;
        count = 1;
        document.getElementById('countDisplay').textContent = '1';
        document.getElementById('nameInput').value = '';
        renderContributors();
      });
    });

    // List tab switching (공개 목록/내 제출)
    document.querySelectorAll('.list-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.list-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentView = tab.dataset.view;

        document.getElementById('publicSection').style.display = currentView === 'public' ? 'block' : 'none';
        document.getElementById('personalSection').style.display = currentView === 'personal' ? 'block' : 'none';

        renderList();
      });
    });

    init();
  </script>
</body>
</html>
