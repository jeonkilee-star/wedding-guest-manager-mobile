<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1B5E45">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>결혼식 하객 관리</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+CJK+KR:wght@400;500;700&display=swap">
  <style>
    :root {
      --primary: #1B5E45;
      --accent: #D4AF37;
      --success: #059669;
      --warning: #D97706;
      --danger: #DC2626;
      --bg: #ffffff;
      --card-bg: #ffffff;
      --text: #2D3E50;
      --text-muted: #6B7280;
      --border: #D4C5B9;
      --safe-bottom: max(16px, env(safe-area-inset-bottom));
    }

    :root.groom-theme {
      --primary: #2563EB;
      --accent: #1E40AF;
    }

    :root.bride-theme {
      --primary: #EC4899;
      --accent: #DB2777;
    }

    /* 라이트 모드 고정 */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff !important;
      color: #2D3E50 !important;
      font-family: "Noto Sans CJK KR", sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--border);
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 1.5px;
      flex: 1;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .header-btn:active {
      background: var(--border);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 12px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .role-btn {
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .role-btn.active {
      background: linear-gradient(135deg, #7C3AED 0%, #EC4899 100%);
      color: white;
      border-color: #7C3AED;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    .role-btn:active {
      transform: scale(0.95);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 10px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #7C3AED 0%, #EC4899 100%);
      color: white;
      border-color: #7C3AED;
    }

    .count-control {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .count-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .count-btn:active {
      transform: scale(0.9);
    }

    .count-display {
      flex: 1;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }

    .btn {
      padding: 14px;
      background: linear-gradient(135deg, #7C3AED 0%, #EC4899 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
      letter-spacing: 0.5px;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.4);
    }

    .btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-back {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .btn-back:active {
      background: var(--border);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat {
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--card-bg);
      margin-bottom: 12px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      background: var(--bg);
      padding: 10px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    tr:hover {
      background: var(--bg);
    }

    .status-select {
      border: 1px solid var(--border);
      background: var(--card-bg);
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .delete-btn {
      padding: 4px 8px;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .delete-btn:active {
      background: var(--danger);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    .role-info {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      text-align: center;
    }

    .role-info .side {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .role-info .role {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1 style="cursor: pointer;" onclick="goToMainApp()" title="메인화면으로 돌아가기">💍 결혼식 하객 관리</h1>
      <div class="header-actions" id="headerActions" style="display: none;">
        <button class="header-btn" onclick="showSettings()" title="역할 변경">⚙️</button>
      </div>
    </div>

    <!-- 첫 방문: 역할 등록 화면 -->
    <div id="setupPage" style="display: none;">
      <div class="content">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 32px; text-align: center;">
          <div style="margin-bottom: 24px;">
            <div style="font-size: 48px; margin-bottom: 16px;">💍</div>
            <h2 style="margin: 0; font-size: 18px; color: var(--text); margin-bottom: 8px;">기기 등록</h2>
            <p style="margin: 0; color: var(--text-muted); font-size: 13px;">이 폰에서 하객을 입력할 사람을 선택해주세요</p>
          </div>

          <div style="width: 100%; margin-bottom: 20px;">
            <div style="margin-bottom: 16px;">
              <div class="section-title">신랑측 / 신부측</div>
              <div class="tabs">
                <button onclick="selectSideForSetup('groom')" id="setupGroomBtn" class="tab-btn active">신랑측</button>
                <button onclick="selectSideForSetup('bride')" id="setupBrideBtn" class="tab-btn">신부측</button>
              </div>
            </div>

            <div id="setupRoleContainer" style="margin-bottom: 16px;">
              <div class="section-title">역할 선택</div>
              <div class="button-grid" id="setupRoleButtons"></div>
            </div>
          </div>

          <button id="confirmSetupBtn" onclick="confirmRoleSetup()" class="btn" style="width: 100%;">등록하기</button>
        </div>
      </div>
    </div>

    <!-- 메인 앱 화면 -->
    <div id="mainApp" style="display: none;">
      <!-- 입력 페이지 -->
      <div id="inputPage" class="content">
        <div class="role-info">
          <div class="side" id="currentSideLabel">신랑측</div>
          <div class="role" id="currentRoleLabel">역할</div>
        </div>

        <div class="section">
          <label for="nameInput">메모 (예: 친구 3명)</label>
          <input type="text" id="nameInput" placeholder="예: 친구 3명, 큰아버지댁">
        </div>

        <div class="section">
          <label>인원수</label>
          <div class="count-control">
            <button class="count-btn" onclick="decreaseCount()">−</button>
            <input type="number" id="countDisplay" value="1" min="1" max="9999" inputmode="numeric" style="flex: 1; text-align: center; font-size: 20px; font-weight: 700; color: var(--primary); border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg);" onfocus="this.select()" onchange="updateCountFromInput()" onkeypress="handleCountKeypress(event)">
            <button class="count-btn" onclick="increaseCount()">+</button>
          </div>
        </div>

        <button class="btn" id="saveBtn" style="width: 100%;" onclick="saveSubmission()">추가하기</button>

        <div class="divider"></div>

        <div id="syncBadge" style="font-size: 11px; font-weight: 600; text-align: center; margin-bottom: 10px; color: var(--text-muted);"></div>

        <!-- 전체 현황 (누구나 볼 수 있음) -->
        <div class="stats">
          <div class="stat">
            <div class="stat-label">총 인원</div>
            <div class="stat-value" id="totalCount">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">신랑측</div>
            <div class="stat-value" id="groomTotal">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">신부측</div>
            <div class="stat-value" id="brideTotal">0</div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="section">
          <div class="section-title">역할별 현황</div>
          <div class="tabs">
            <button onclick="switchBreakdownSide('groom')" id="breakdownGroomBtn" class="tab-btn active">신랑측</button>
            <button onclick="switchBreakdownSide('bride')" id="breakdownBrideBtn" class="tab-btn">신부측</button>
          </div>
          <div id="roleBreakdown" style="background: var(--card-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border);"></div>
        </div>

        <div class="divider"></div>

        <div class="section-title">내 제출 내역</div>
        <div id="personalSection"></div>
      </div>
    </div>

    <!-- 설정 화면 -->
    <div id="settingsPage" style="display: none;">
      <div class="content">
        <button class="btn-back" onclick="hideSettings()">← 뒤로</button>

        <div class="section">
          <div class="role-info">
            <div class="side" id="settingsSideLabel">신랑측</div>
            <div class="role" id="settingsRoleLabel">역할</div>
          </div>
        </div>

        <div class="section">
          <button class="btn" style="width: 100%; background: var(--danger); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);" onclick="changeRole()">역할 변경</button>
        </div>

        <div class="divider"></div>

        <div class="section">
          <label style="margin-bottom: 12px;">데이터 관리</label>
          <button class="btn" style="width: 100%; background: var(--danger); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);" onclick="resetAllData()">🗑️ 모든 데이터 초기화</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-nloHoLu9XKEgF22jPzZBTjILwQrzfSM",
      authDomain: "wedding-guests-21e70.firebaseapp.com",
      projectId: "wedding-guests-21e70",
      storageBucket: "wedding-guests-21e70.firebasestorage.app",
      messagingSenderId: "347570430174",
      appId: "1:347570430174:web:a7b5fd2adf566cb188e24f"
    };

    const CONTRIBUTORS = {
      groom: ['신랑 (이정민)', '아버지', '어머니', '동생'],
      bride: ['신부 (김예미)', '아버지', '어머니', '언니']
    };

    let registeredRole = null;
    let breakdownSide = 'groom';
    let submissions = [];
    let fdb = null;
    let unsubscribe = null;
    let count = 1;

    function initFirebase() {
      if (!firebaseConfig.apiKey || !firebaseConfig.projectId) {
        console.log("Firebase 미설정 — 이 기기에만 저장됩니다.");
        return;
      }
      try {
        firebase.initializeApp(firebaseConfig);
        fdb = firebase.firestore();
      } catch (e) {
        console.error("Firebase 초기화 실패:", e);
        fdb = null;
      }
    }

    function updateSyncBadge(state) {
      const badge = document.getElementById('syncBadge');
      if (!badge) return;
      if (state === 'error') {
        badge.textContent = '⚠️ 연결 실패 — 이 기기에만 저장됨';
        badge.style.color = 'var(--danger)';
      } else if (fdb) {
        badge.textContent = '🔄 가족과 실시간 공유 중';
        badge.style.color = 'var(--success)';
      } else {
        badge.textContent = '📱 이 기기에만 저장됨';
        badge.style.color = 'var(--text-muted)';
      }
    }

    async function init() {
      initFirebase();

      const saved = localStorage.getItem("wedding-registered-role");
      if (!saved) {
        showSetupPage();
        return;
      }

      registeredRole = JSON.parse(saved);
      showMainApp();
    }

    function showSetupPage() {
      document.getElementById('setupPage').style.display = 'block';
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('settingsPage').style.display = 'none';

      selectSideForSetup('groom');
    }

    let setupSide = 'groom';
    let setupRole = null;

    function selectSideForSetup(side) {
      setupSide = side;
      document.getElementById('setupGroomBtn').classList.toggle('active', side === 'groom');
      document.getElementById('setupBrideBtn').classList.toggle('active', side === 'bride');

      const roles = CONTRIBUTORS[side];
      const roleContainer = document.getElementById('setupRoleButtons');
      setupRole = null;
      roleContainer.innerHTML = roles.map(role => `
        <button onclick="selectRoleForSetup('${role}')" class="role-btn">${role}</button>
      `).join('');
    }

    function selectRoleForSetup(role) {
      setupRole = role;
      document.querySelectorAll('#setupRoleButtons .role-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === role);
      });
    }

    function confirmRoleSetup() {
      if (!setupSide || !setupRole) {
        alert('신랑측/신부측과 역할을 선택해주세요.');
        return;
      }

      registeredRole = { side: setupSide, role: setupRole };
      localStorage.setItem("wedding-registered-role", JSON.stringify(registeredRole));

      location.reload();
    }

    async function showMainApp() {
      document.getElementById('setupPage').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      document.getElementById('settingsPage').style.display = 'none';
      document.getElementById('headerActions').style.display = 'flex';
      document.getElementById('inputPage').style.display = 'block';

      updateCurrentRoleDisplay();
      applyTheme();

      breakdownSide = registeredRole.side;
      document.getElementById('breakdownGroomBtn').classList.toggle('active', breakdownSide === 'groom');
      document.getElementById('breakdownBrideBtn').classList.toggle('active', breakdownSide === 'bride');

      await loadSubmissions();
      renderStats();
    }

    function showSettings() {
      document.getElementById('setupPage').style.display = 'none';
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('settingsPage').style.display = 'block';
      document.getElementById('headerActions').style.display = 'flex';

      updateSettingsDisplay();
    }

    function hideSettings() {
      showMainApp();
    }

    function goToMainApp() {
      if (!registeredRole) return;
      showMainApp();
    }

    function updateCurrentRoleDisplay() {
      const sideLabel = registeredRole.side === 'groom' ? '신랑측' : '신부측';
      document.getElementById('currentSideLabel').textContent = sideLabel;
      document.getElementById('currentRoleLabel').textContent = registeredRole.role;
    }

    function updateSettingsDisplay() {
      const sideLabel = registeredRole.side === 'groom' ? '신랑측' : '신부측';
      document.getElementById('settingsSideLabel').textContent = sideLabel;
      document.getElementById('settingsRoleLabel').textContent = registeredRole.role;
    }

    function changeRole() {
      localStorage.removeItem("wedding-registered-role");
      location.reload();
    }

    async function resetAllData() {
      const scope = fdb
        ? '⚠️ 가족 모두가 입력한 데이터가 전부 삭제됩니다.\n다른 사람 폰에서도 사라집니다. 계속할까요?'
        : '⚠️ 이 기기의 모든 데이터가 삭제됩니다. 계속할까요?';

      if (!confirm(scope)) return;
      if (!confirm('🗑️ 되돌릴 수 없습니다. 한 번 더 확인합니다.')) return;

      if (fdb) {
        try {
          const snap = await fdb.collection("submissions").get();
          const batch = fdb.batch();
          snap.docs.forEach(d => batch.delete(d.ref));
          await batch.commit();
        } catch (e) {
          console.error("서버 데이터 삭제 실패:", e);
          alert('서버 데이터 삭제에 실패했습니다: ' + e.message);
          return;
        }
      }

      localStorage.removeItem("wedding-registered-role");
      localStorage.removeItem("wedding-submissions");

      alert('✅ 모든 데이터가 삭제되었습니다.');
      location.reload();
    }

    function applyTheme() {
      const root = document.documentElement;
      if (registeredRole.side === 'groom') {
        root.classList.add('groom-theme');
        root.classList.remove('bride-theme');
      } else {
        root.classList.add('bride-theme');
        root.classList.remove('groom-theme');
      }
    }

    function increaseCount() {
      count++;
      document.getElementById('countDisplay').value = count;
    }

    function decreaseCount() {
      if (count > 1) {
        count--;
        document.getElementById('countDisplay').value = count;
      }
    }

    function updateCountFromInput() {
      const input = document.getElementById('countDisplay');
      let value = parseInt(input.value) || 1;
      if (value < 1) value = 1;
      if (value > 9999) value = 9999;
      count = value;
      input.value = count;
    }

    function handleCountKeypress(event) {
      if (event.key === 'Enter') {
        updateCountFromInput();
        event.target.blur();
      }
    }

    let saving = false;

    async function saveSubmission() {
      if (saving) return;

      updateCountFromInput();

      if (count >= 100 && !confirm(`${count}명이 맞습니까?\n\n한 번에 입력하는 인원치고 큰 숫자입니다.`)) {
        return;
      }

      const btn = document.getElementById('saveBtn');
      saving = true;
      btn.disabled = true;

      try {
        const note = document.getElementById('nameInput').value.trim();
        const contributor = `${registeredRole.side === 'groom' ? '신랑측' : '신부측'} ${registeredRole.role}`;

        const data = {
          contributor,
          count,
          personalNote: note,
          createdAt: Date.now(),
          userSide: registeredRole.side,
          userRole: registeredRole.role
        };

        if (fdb) {
          try {
            await fdb.collection("submissions").add(data);
          } catch (e) {
            console.error("저장 실패:", e);
            alert('저장에 실패했습니다: ' + e.message);
            return;
          }
        } else {
          submissions.push({ id: `sub_${Date.now()}`, ...data });
          saveToLocalStorage();
          renderPersonalList();
          renderStats();
        }

        document.getElementById('nameInput').value = '';
        count = 1;
        document.getElementById('countDisplay').value = '1';
        document.getElementById('nameInput').focus();
      } finally {
        saving = false;
        btn.disabled = false;
      }
    }

    async function loadSubmissions() {
      if (fdb) {
        if (unsubscribe) return;
        unsubscribe = fdb.collection("submissions")
          .orderBy("createdAt", "desc")
          .onSnapshot(
            (snapshot) => {
              submissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              updateSyncBadge();
              renderPersonalList();
              renderStats();
            },
            (err) => {
              console.error("Firestore 구독 실패:", err);
              fdb = null;
              unsubscribe = null;
              updateSyncBadge('error');
              loadFromLocalStorage();
              renderPersonalList();
              renderStats();
            }
          );
      } else {
        loadFromLocalStorage();
        updateSyncBadge();
        renderPersonalList();
      }
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem("wedding-submissions");
      if (saved) {
        try {
          submissions = JSON.parse(saved);
        } catch (e) {
          submissions = [];
        }
      }
    }

    function saveToLocalStorage() {
      localStorage.setItem("wedding-submissions", JSON.stringify(submissions));
    }

    function renderPersonalList() {
      const personalSection = document.getElementById('personalSection');
      const mySubmissions = submissions.filter(s =>
        s.userSide === registeredRole.side && s.userRole === registeredRole.role
      );

      if (mySubmissions.length === 0) {
        personalSection.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <div>아직 입력한 내용이 없습니다</div>
          </div>
        `;
        return;
      }

      personalSection.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>인원</th>
              <th>메모</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${mySubmissions.map(s => `
              <tr>
                <td style="font-weight: 700; font-size: 14px;">${Number(s.count) || 0}명</td>
                <td style="font-size: 12px; color: var(--text-muted);">${esc(s.personalNote) || '—'}</td>
                <td>
                  <button class="delete-btn" onclick="deleteSubmission('${esc(s.id)}')">삭제</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function getSide(s) {
      return s.userSide || (String(s.contributor || '').includes('신랑측') ? 'groom' : 'bride');
    }

    function renderStats() {
      const total = submissions.reduce((sum, s) => sum + s.count, 0);
      const groomTotal = submissions.filter(s => getSide(s) === 'groom').reduce((sum, s) => sum + s.count, 0);
      const brideTotal = submissions.filter(s => getSide(s) === 'bride').reduce((sum, s) => sum + s.count, 0);

      document.getElementById('totalCount').textContent = total;
      document.getElementById('groomTotal').textContent = groomTotal;
      document.getElementById('brideTotal').textContent = brideTotal;

      renderRoleBreakdown();
    }

    function switchBreakdownSide(side) {
      breakdownSide = side;
      document.getElementById('breakdownGroomBtn').classList.toggle('active', side === 'groom');
      document.getElementById('breakdownBrideBtn').classList.toggle('active', side === 'bride');
      renderRoleBreakdown();
    }

    function renderRoleBreakdown() {
      const sideSubmissions = submissions.filter(s => getSide(s) === breakdownSide);

      const counts = {};
      sideSubmissions.forEach(s => {
        const role = s.userRole || s.contributor.split(' ').slice(1).join(' ');
        counts[role] = (counts[role] || 0) + s.count;
      });

      const roleOrder = CONTRIBUTORS[breakdownSide].slice();
      Object.keys(counts).forEach(r => { if (!roleOrder.includes(r)) roleOrder.push(r); });

      let total = 0;

      let html = roleOrder.map(role => {
        const count = counts[role] || 0;
        total += count;
        return `
          <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border);">
            <div style="font-weight: 600;">${esc(role)}</div>
            <div style="font-weight: 700; color: var(--primary);">${count}명</div>
          </div>
        `;
      }).join('');

      html += `
        <div style="display: flex; justify-content: space-between; margin-top: 8px; padding-top: 12px; border-top: 2px solid var(--primary);">
          <div style="font-weight: 700; color: var(--primary);">총 합계</div>
          <div style="font-weight: 700; color: var(--primary); font-size: 16px;">${total}명</div>
        </div>
      `;

      document.getElementById('roleBreakdown').innerHTML = html;
    }

    async function deleteSubmission(id) {
      if (!confirm('삭제하시겠습니까?')) return;

      if (fdb) {
        try {
          await fdb.collection("submissions").doc(id).delete();
        } catch (e) {
          console.error("삭제 실패:", e);
          alert('삭제에 실패했습니다: ' + e.message);
        }
        return;
      }

      submissions = submissions.filter(s => s.id !== id);
      saveToLocalStorage();
      renderPersonalList();
      renderStats();
    }

    init();

    document.addEventListener('DOMContentLoaded', () => {
      const nameInput = document.getElementById('nameInput');
      if (nameInput) {
        nameInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') saveSubmission();
        });
      }
    });
  </script>
</body>
</html>
