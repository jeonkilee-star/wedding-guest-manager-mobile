<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1B5E45">
  <title>결혼식 하객 관리</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+CJK+KR:wght@400;500;700&display=swap">
  <style>
    :root {
      --primary: #1B5E45;
      --accent: #D4AF37;
      --success: #059669;
      --warning: #D97706;
      --danger: #DC2626;
      --bg: linear-gradient(135deg, #f5f5f0 0%, #e8f4f0 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #2D3E50;
      --text-muted: #6B7280;
      --border: #D4C5B9;
      --safe-bottom: max(16px, env(safe-area-inset-bottom));
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #A8D5BA;
        --accent: #D4AF37;
        --bg: linear-gradient(135deg, #1a2f28 0%, #0f1f1a 100%);
        --card-bg: rgba(45, 62, 80, 0.95);
        --text: #F3F4F6;
        --text-muted: #9CA3AF;
        --border: #4B5563;
      }
    }

    :root[data-theme="dark"] {
      --primary: #A8D5BA;
      --accent: #D4AF37;
      --bg: linear-gradient(135deg, #1a2f28 0%, #0f1f1a 100%);
      --card-bg: rgba(45, 62, 80, 0.95);
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --border: #4B5563;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans CJK KR", sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .header {
      background: linear-gradient(135deg, rgba(27, 94, 69, 0.08) 0%, rgba(212, 175, 55, 0.06) 100%);
      border-bottom: 2px solid var(--border);
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 1px;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: var(--safe-bottom);
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-role {
      background: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--border);
    }

    .btn-role:active {
      transform: scale(0.95);
      box-shadow: 0 4px 12px rgba(27, 94, 69, 0.15);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #0f3d2e 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(27, 94, 69, 0.2);
    }

    .btn-primary:active {
      transform: scale(0.97);
      box-shadow: 0 6px 16px rgba(27, 94, 69, 0.3);
    }

    .btn-back {
      background: var(--card-bg);
      color: var(--primary);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      width: 100%;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--card-bg);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    .count-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .count-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .count-display {
      flex: 1;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }

    .list-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-item-info {
      flex: 1;
    }

    .list-item-role {
      font-weight: 600;
      font-size: 14px;
      color: var(--primary);
    }

    .list-item-count {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .list-item-note {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      font-style: italic;
    }

    .list-item-actions {
      display: flex;
      gap: 6px;
    }

    .btn-small {
      padding: 6px 10px;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-small:active {
      background: var(--danger);
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    .password-input {
      text-align: center;
      letter-spacing: 3px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 32px 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .page {
      display: none;
    }

    .page.active {
      display: flex;
      flex-direction: column;
    }

    .page.active .content {
      display: block;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>💍 결혼식 하객 관리</h1>
    </div>

    <!-- 역할 선택 페이지 -->
    <div id="rolePage" class="page active">
      <div class="content">
        <div class="tabs">
          <button class="tab-btn active" onclick="setRoleSide('groom')">신랑측</button>
          <button class="tab-btn" onclick="setRoleSide('bride')">신부측</button>
        </div>

        <div class="section">
          <div class="section-title">역할 선택</div>
          <div class="button-grid" id="roleButtons"></div>
        </div>

        <div class="divider"></div>

        <div class="section">
          <button class="btn btn-primary" style="width: 100%;" onclick="goToDashboard()">📊 통계 보기 (신랑/신부)</button>
        </div>
      </div>
    </div>

    <!-- 역할별 입력 페이지 -->
    <div id="rolePage_inner" class="page">
      <div class="content">
        <button class="btn-back" onclick="goToRoles()">← 뒤로</button>

        <div id="roleHeader" class="section" style="text-align: center;">
          <div style="font-size: 20px; color: var(--primary); font-weight: 700; margin-bottom: 4px;" id="roleTitle"></div>
        </div>

        <div class="section">
          <label>메모 (예: 친구 3명, 직장동료)</label>
          <input type="text" id="roleNote" placeholder="개인 기록용">
        </div>

        <div class="section">
          <label>인원수</label>
          <div class="count-control">
            <button class="count-btn" onclick="decreaseRoleCount()">−</button>
            <div class="count-display" id="roleCountDisplay">1</div>
            <button class="count-btn" onclick="increaseRoleCount()">+</button>
          </div>
        </div>

        <button class="btn btn-primary" style="width: 100%; margin-bottom: 12px;" onclick="saveRoleSubmission()">추가하기</button>

        <div class="divider"></div>

        <div class="section-title">이미 입력한 내용</div>
        <div id="roleSubmissionsList"></div>
      </div>
    </div>

    <!-- 대시보드 페이지 -->
    <div id="dashboardPage" class="page">
      <div class="content">
        <button class="btn-back" onclick="goToRoles()">← 뒤로</button>

        <div class="section">
          <div class="section-title">신랑/신부 선택</div>
          <div class="tabs">
            <button class="tab-btn active" onclick="setDashboardSide('groom')">신랑</button>
            <button class="tab-btn" onclick="setDashboardSide('bride')">신부</button>
          </div>
        </div>

        <div id="setPasswordSection">
          <label>신규 비밀번호 설정 (4자리 숫자)</label>
          <input type="number" id="newPasswordInput" class="password-input" placeholder="0000" maxlength="4" min="0" max="9999">
          <label style="margin-top: 12px;">비밀번호 확인</label>
          <input type="number" id="newPasswordConfirm" class="password-input" placeholder="0000" maxlength="4" min="0" max="9999">
          <button class="btn btn-primary" style="width: 100%; margin-top: 8px;" onclick="setPassword()">비밀번호 설정</button>
        </div>

        <div id="loginSection" style="display: none;">
          <label>비밀번호 입력 (4자리)</label>
          <input type="password" id="passwordInput" class="password-input" placeholder="0000" maxlength="4">
          <button class="btn btn-primary" style="width: 100%; margin-top: 8px;" onclick="checkPassword()">확인</button>
        </div>

        <div id="lockedContent" style="text-align: center; color: var(--text-muted); padding: 40px 16px;">
          🔒 비밀번호를 입력해주세요
        </div>

        <div id="dashboardContent" style="display: none;">
          <div class="divider"></div>

          <div class="stats">
            <div class="stat">
              <div class="stat-label">우리 측 총 인원</div>
              <div class="stat-value" id="ourTotal">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">상대방 총 인원</div>
              <div class="stat-value" id="theirTotal">0</div>
            </div>
          </div>

          <div class="section-title">우리 측 세부 정보</div>
          <div id="detailList"></div>

          <div class="divider"></div>

          <div class="section-title">상대방 (총 인원만 표시)</div>
          <div class="stat">
            <div class="stat-label">총 인원</div>
            <div class="stat-value" id="theirTotalDisplay">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ROLES = {
      groom: ['신랑', '아버지', '어머니', '동생'],
      bride: ['신부', '아버지', '어머니', '언니']
    };

    let currentSide = 'groom';
    let currentRole = null;
    let roleCount = 1;
    let submissions = [];
    let passwords = {};
    let db = null;

    async function init() {
      db = await claude.use("db");
      await loadSubmissions();
      await loadPasswords();
      renderRoleButtons();
    }

    function setRoleSide(side) {
      currentSide = side;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderRoleButtons();
    }

    function renderRoleButtons() {
      const container = document.getElementById('roleButtons');
      container.innerHTML = ROLES[currentSide].map(role => `
        <button class="btn btn-role" onclick="goToRole('${role}')">
          ${role}
        </button>
      `).join('');
    }

    function goToRole(role) {
      currentRole = role;
      roleCount = 1;
      document.getElementById('roleNote').value = '';
      document.getElementById('roleCountDisplay').textContent = '1';
      document.getElementById('roleTitle').textContent = `${currentSide === 'groom' ? '신랑측' : '신부측'} ${role}`;

      document.getElementById('rolePage').classList.remove('active');
      document.getElementById('rolePage_inner').classList.add('active');

      renderRoleSubmissions();
    }

    function goToRoles() {
      document.getElementById('rolePage_inner').classList.remove('active');
      document.getElementById('dashboardPage').classList.remove('active');
      document.getElementById('rolePage').classList.add('active');
    }

    function goToDashboard() {
      document.getElementById('rolePage').classList.remove('active');
      document.getElementById('dashboardPage').classList.add('active');
      currentSide = 'groom';
      updateDashboard();
    }

    function increaseRoleCount() {
      roleCount++;
      document.getElementById('roleCountDisplay').textContent = roleCount;
    }

    function decreaseRoleCount() {
      if (roleCount > 1) {
        roleCount--;
        document.getElementById('roleCountDisplay').textContent = roleCount;
      }
    }

    async function saveRoleSubmission() {
      const note = document.getElementById('roleNote').value.trim();
      const submission = {
        id: `${Date.now()}`,
        side: currentSide,
        role: currentRole,
        count: roleCount,
        personalNote: note,
        createdAt: Date.now()
      };

      if (db) {
        try {
          await db.collection("wedding/submissions").set(submission.id, submission);
        } catch (e) {
          console.error("DB save failed:", e);
          submissions.push(submission);
        }
      } else {
        submissions.push(submission);
      }

      document.getElementById('roleNote').value = '';
      roleCount = 1;
      document.getElementById('roleCountDisplay').textContent = '1';
      await loadSubmissions();
      renderRoleSubmissions();
    }

    function renderRoleSubmissions() {
      const list = document.getElementById('roleSubmissionsList');
      const items = submissions.filter(s => s.side === currentSide && s.role === currentRole);

      if (items.length === 0) {
        list.innerHTML = '<div class="empty-state">아직 입력한 내용이 없습니다</div>';
        return;
      }

      list.innerHTML = items.map(item => `
        <div class="list-item">
          <div class="list-item-info">
            <div class="list-item-count">${item.count}명</div>
            ${item.personalNote ? `<div class="list-item-note">${item.personalNote}</div>` : ''}
          </div>
          <button class="btn-small" onclick="deleteSubmission('${item.id}')">삭제</button>
        </div>
      `).join('');
    }

    async function deleteSubmission(id) {
      if (!confirm('삭제하시겠습니까?')) return;
      submissions = submissions.filter(s => s.id !== id);
      if (db) {
        try {
          await db.collection("wedding/submissions").delete(id);
        } catch (e) {}
      }
      renderRoleSubmissions();
    }

    async function loadSubmissions() {
      if (db) {
        try {
          const result = await db.collection("wedding/submissions").orderBy({ field: "createdAt", direction: "desc" }).get();
          submissions = result.docs.map(doc => ({ id: doc.id, ...doc.data }));
          db.collection("wedding/submissions").onSnapshot((snapshot) => {
            submissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data }));
          });
        } catch (e) {
          submissions = [];
        }
      }
    }

    function setDashboardSide(side) {
      currentSide = side;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      showPasswordScreen();
    }

    async function loadPasswords() {
      // 먼저 로컬 스토리지에서 로드
      const saved = localStorage.getItem("wedding-passwords");
      if (saved) {
        try {
          passwords = JSON.parse(saved);
          return;
        } catch (e) {}
      }

      // db에서 로드
      if (db) {
        try {
          const result = await db.collection("wedding/passwords").get();
          passwords = result.docs.map(doc => ({ id: doc.id, ...doc.data }));
          localStorage.setItem("wedding-passwords", JSON.stringify(passwords));
        } catch (e) {
          passwords = [];
        }
      } else {
        passwords = [];
      }
    }

    function savePasswordLocal() {
      localStorage.setItem("wedding-passwords", JSON.stringify(passwords));
    }

    function showPasswordScreen() {
      const side = currentSide;
      const hasPassword = passwords.some(p => p.id === side);

      document.getElementById('lockedContent').style.display = 'block';
      document.getElementById('dashboardContent').style.display = 'none';

      if (hasPassword) {
        document.getElementById('setPasswordSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      } else {
        document.getElementById('setPasswordSection').style.display = 'block';
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('newPasswordInput').value = '';
        document.getElementById('newPasswordConfirm').value = '';
        document.getElementById('newPasswordInput').focus();
      }
    }

    async function setPassword() {
      const pwd1 = document.getElementById('newPasswordInput').value;
      const pwd2 = document.getElementById('newPasswordConfirm').value;

      if (!pwd1 || !pwd2) {
        alert('비밀번호를 입력해주세요');
        return;
      }

      if (pwd1.length !== 4 || pwd2.length !== 4) {
        alert('비밀번호는 4자리 숫자여야 합니다');
        return;
      }

      if (pwd1 !== pwd2) {
        alert('비밀번호가 일치하지 않습니다');
        return;
      }

      // 기존 항목 삭제 후 추가
      passwords = passwords.filter(p => p.id !== currentSide);
      passwords.push({ id: currentSide, password: pwd1 });

      savePasswordLocal();

      if (db) {
        try {
          await db.collection("wedding/passwords").set(currentSide, { password: pwd1 });
        } catch (e) {
          console.error("DB save failed:", e);
        }
      }

      showPasswordScreen();
      alert('비밀번호가 설정되었습니다');
    }

    function checkPassword() {
      const pwd = document.getElementById('passwordInput').value.trim();

      if (!pwd || pwd.length !== 4) {
        alert('비밀번호를 정확히 입력해주세요');
        return;
      }

      // 저장된 비밀번호 찾기
      let storedPwd = null;
      for (let p of passwords) {
        if (p.id === currentSide) {
          storedPwd = p.password;
          break;
        }
      }

      if (!storedPwd) {
        alert('비밀번호가 설정되지 않았습니다');
        return;
      }

      if (pwd === String(storedPwd)) {
        document.getElementById('lockedContent').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
        updateDashboard();
      } else {
        alert('비밀번호가 틀렸습니다');
        document.getElementById('passwordInput').value = '';
      }
    }

    function updateDashboard() {
      const ourSide = currentSide;
      const theirSide = currentSide === 'groom' ? 'bride' : 'groom';

      const ourSubmissions = submissions.filter(s => s.side === ourSide);
      const theirSubmissions = submissions.filter(s => s.side === theirSide);

      const ourTotal = ourSubmissions.reduce((sum, s) => sum + s.count, 0);
      const theirTotal = theirSubmissions.reduce((sum, s) => sum + s.count, 0);

      document.getElementById('ourTotal').textContent = ourTotal;
      document.getElementById('theirTotal').textContent = theirTotal;
      document.getElementById('theirTotalDisplay').textContent = theirTotal;

      // 우리 측 세부 정보 (역할별)
      const detailList = document.getElementById('detailList');
      const roleGroups = {};
      ourSubmissions.forEach(s => {
        if (!roleGroups[s.role]) roleGroups[s.role] = [];
        roleGroups[s.role].push(s);
      });

      detailList.innerHTML = Object.entries(roleGroups).map(([role, items]) => {
        const roleTotal = items.reduce((sum, s) => sum + s.count, 0);
        return `
          <div class="list-item">
            <div class="list-item-info">
              <div class="list-item-role">${role}</div>
              <div class="list-item-count">총 ${roleTotal}명</div>
              ${items.map(item => `
                <div class="list-item-note">
                  ${item.personalNote || '(메모 없음)'} - ${item.count}명
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('') || '<div class="empty-state">입력된 내용이 없습니다</div>';
    }

    init();
  </script>
</body>
</html>
