<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1B5E45">
  <title>결혼식 하객 관리</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+CJK+KR:wght@400;500;700&display=swap">
  <style>
    :root {
      --primary: #1B5E45;
      --accent: #D4AF37;
      --success: #059669;
      --warning: #D97706;
      --danger: #DC2626;
      --bg: #ffffff;
      --card-bg: #ffffff;
      --text: #2D3E50;
      --text-muted: #6B7280;
      --border: #D4C5B9;
      --safe-bottom: max(16px, env(safe-area-inset-bottom));
    }

    :root.groom-theme {
      --primary: #2563EB;
      --accent: #1E40AF;
    }

    :root.bride-theme {
      --primary: #EC4899;
      --accent: #DB2777;
    }

    /* 라이트 모드 고정 */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff !important;
      color: #2D3E50 !important;
      font-family: "Noto Sans CJK KR", sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--border);
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 1.5px;
      flex: 1;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .header-btn:active {
      background: var(--border);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 12px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .role-btn {
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .role-btn.active {
      background: linear-gradient(135deg, #7C3AED 0%, #EC4899 100%);
      color: white;
      border-color: #7C3AED;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    .role-btn:active {
      transform: scale(0.95);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 10px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #7C3AED 0%, #EC4899 100%);
      color: white;
      border-color: #7C3AED;
    }

    .count-control {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .count-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .count-btn:active {
      transform: scale(0.9);
    }

    .count-display {
      flex: 1;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }

    .btn {
      padding: 14px;
      background: linear-gradient(135deg, #7C3AED 0%, #EC4899 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
      letter-spacing: 0.5px;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.4);
    }

    .btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-back {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .btn-back:active {
      background: var(--border);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat {
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--card-bg);
      margin-bottom: 12px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      background: var(--bg);
      padding: 10px;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    tr:hover {
      background: var(--bg);
    }

    .status-select {
      border: 1px solid var(--border);
      background: var(--card-bg);
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .delete-btn {
      padding: 4px 8px;
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .delete-btn:active {
      background: var(--danger);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    .role-info {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      text-align: center;
    }

    .role-info .side {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .role-info .role {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>💍 결혼식 하객 관리</h1>
      <div class="header-actions" id="headerActions" style="display: none;">
        <button class="header-btn" onclick="showSettings()" title="역할 변경">⚙️</button>
      </div>
    </div>

    <!-- 첫 방문: 역할 등록 화면 -->
    <div id="setupPage" style="display: none;">
      <div class="content">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 32px; text-align: center;">
          <div style="margin-bottom: 24px;">
            <div style="font-size: 48px; margin-bottom: 16px;">💍</div>
            <h2 style="margin: 0; font-size: 18px; color: var(--text); margin-bottom: 8px;">기기 등록</h2>
            <p style="margin: 0; color: var(--text-muted); font-size: 13px;">이 폰에서 하객을 입력할 사람을 선택해주세요</p>
          </div>

          <div style="width: 100%; margin-bottom: 20px;">
            <div style="margin-bottom: 16px;">
              <div class="section-title">신랑측 / 신부측</div>
              <div class="tabs">
                <button onclick="selectSideForSetup('groom')" id="setupGroomBtn" class="tab-btn active">신랑측</button>
                <button onclick="selectSideForSetup('bride')" id="setupBrideBtn" class="tab-btn">신부측</button>
              </div>
            </div>

            <div id="setupRoleContainer" style="margin-bottom: 16px;">
              <div class="section-title">역할 선택</div>
              <div class="button-grid" id="setupRoleButtons"></div>
            </div>
          </div>

          <button id="confirmSetupBtn" onclick="confirmRoleSetup()" class="btn" style="width: 100%;">등록하기</button>
        </div>
      </div>
    </div>

    <!-- 메인 앱 화면 -->
    <div id="mainApp" style="display: none;">
      <!-- 입력 페이지 -->
      <div id="inputPage" class="content">
        <div class="role-info">
          <div class="side" id="currentSideLabel">신랑측</div>
          <div class="role" id="currentRoleLabel">역할</div>
        </div>

        <div class="section">
          <label for="nameInput">메모 (예: 친구 3명)</label>
          <input type="text" id="nameInput" placeholder="개인 기록용, 공유 안 됨">
        </div>

        <div class="section">
          <label>인원수</label>
          <div class="count-control">
            <button class="count-btn" onclick="decreaseCount()">−</button>
            <div class="count-display" id="countDisplay">1</div>
            <button class="count-btn" onclick="increaseCount()">+</button>
          </div>
        </div>

        <button class="btn" style="width: 100%;" onclick="saveSubmission()">추가하기</button>

        <div class="divider"></div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">총 인원</div>
            <div class="stat-value" id="totalCount">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">제출 건수</div>
            <div class="stat-value" id="submitCount">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">참석</div>
            <div class="stat-value" id="attendedCount" style="color: var(--success);">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">미응답</div>
            <div class="stat-value" id="pendingCount" style="color: var(--warning);">0</div>
          </div>
        </div>

        <div class="section-title">내 제출 내역</div>
        <div id="personalSection"></div>
      </div>

      <!-- 신랑/신부 대시보드 -->
      <div id="dashboardPage" style="display: none;" class="content">
        <button class="btn-back" onclick="showInputPage()">← 뒤로</button>

        <div class="section">
          <label style="margin-bottom: 12px;">신랑/신부 비밀번호 입력</label>
          <input type="password" id="dashboardPassword" placeholder="비밀번호" maxlength="8">
          <button class="btn" style="width: 100%;" onclick="checkDashboardPassword()">확인</button>
        </div>

        <div id="dashboardLocked" style="text-align: center; color: var(--text-muted); padding: 40px 16px;">
          🔒 비밀번호를 입력해주세요
        </div>

        <div id="dashboardUnlocked" style="display: none;">
          <div class="divider"></div>

          <div class="section">
            <div class="section-title">신랑측 / 신부측</div>
            <div class="tabs">
              <button onclick="switchDashboardSide('groom')" id="dashGroomBtn" class="tab-btn active">신랑측</button>
              <button onclick="switchDashboardSide('bride')" id="dashBrideBtn" class="tab-btn">신부측</button>
            </div>
          </div>

          <div class="stats">
            <div class="stat">
              <div class="stat-label">총 인원</div>
              <div class="stat-value" id="dashTotal">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">제출 건수</div>
              <div class="stat-value" id="dashSubmitCount">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">참석</div>
              <div class="stat-value" id="dashAttended" style="color: var(--success);">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">미응답</div>
              <div class="stat-value" id="dashPending" style="color: var(--warning);">0</div>
            </div>
          </div>

          <div class="section-title">제출 목록</div>
          <div id="dashboardList"></div>
        </div>
      </div>
    </div>

    <!-- 설정 화면 -->
    <div id="settingsPage" style="display: none;">
      <div class="content">
        <button class="btn-back" onclick="hideSettings()">← 뒤로</button>

        <div class="section">
          <div class="role-info">
            <div class="side" id="settingsSideLabel">신랑측</div>
            <div class="role" id="settingsRoleLabel">역할</div>
          </div>
        </div>

        <div class="section">
          <button class="btn" style="width: 100%; background: var(--danger); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);" onclick="changeRole()">역할 변경</button>
        </div>

        <div class="divider"></div>

        <div class="section">
          <label style="margin-bottom: 12px;">신랑/신부만 사용</label>
          <button class="btn" style="width: 100%;" onclick="goToDashboard()">📊 대시보드 보기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONTRIBUTORS = {
      groom: ['신랑', '아버지', '어머니', '동생'],
      bride: ['신부', '아버지', '어머니', '언니']
    };

    let registeredRole = null;
    let currentDashboardSide = 'groom';
    let isEditMode = false;
    let submissions = [];
    let db = null;
    let count = 1;

    async function init() {
      db = await claude.use("db");

      const saved = localStorage.getItem("wedding-registered-role");
      if (!saved) {
        showSetupPage();
        return;
      }

      registeredRole = JSON.parse(saved);
      showMainApp();
    }

    function showSetupPage() {
      document.getElementById('setupPage').style.display = 'block';
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('settingsPage').style.display = 'none';

      selectSideForSetup('groom');
    }

    let setupSide = 'groom';
    let setupRole = null;

    function selectSideForSetup(side) {
      setupSide = side;
      document.getElementById('setupGroomBtn').classList.toggle('active', side === 'groom');
      document.getElementById('setupBrideBtn').classList.toggle('active', side === 'bride');

      const roles = CONTRIBUTORS[side];
      const roleContainer = document.getElementById('setupRoleButtons');
      setupRole = null;
      roleContainer.innerHTML = roles.map(role => `
        <button onclick="selectRoleForSetup('${role}')" class="role-btn">${role}</button>
      `).join('');
    }

    function selectRoleForSetup(role) {
      setupRole = role;
      document.querySelectorAll('#setupRoleButtons .role-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === role);
      });
    }

    function confirmRoleSetup() {
      if (!setupSide || !setupRole) {
        alert('신랑측/신부측과 역할을 선택해주세요.');
        return;
      }

      registeredRole = { side: setupSide, role: setupRole };
      localStorage.setItem("wedding-registered-role", JSON.stringify(registeredRole));

      location.reload();
    }

    function showMainApp() {
      document.getElementById('setupPage').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      document.getElementById('settingsPage').style.display = 'none';
      document.getElementById('headerActions').style.display = 'flex';
      document.getElementById('inputPage').style.display = 'block';
      document.getElementById('dashboardPage').style.display = 'none';

      updateCurrentRoleDisplay();
      applyTheme();
      loadSubmissions();
      renderStats();
    }

    function showSettings() {
      document.getElementById('setupPage').style.display = 'none';
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('settingsPage').style.display = 'block';
      document.getElementById('headerActions').style.display = 'flex';

      updateSettingsDisplay();
    }

    function hideSettings() {
      showMainApp();
    }

    function updateCurrentRoleDisplay() {
      const sideLabel = registeredRole.side === 'groom' ? '신랑측' : '신부측';
      document.getElementById('currentSideLabel').textContent = sideLabel;
      document.getElementById('currentRoleLabel').textContent = registeredRole.role;
    }

    function updateSettingsDisplay() {
      const sideLabel = registeredRole.side === 'groom' ? '신랑측' : '신부측';
      document.getElementById('settingsSideLabel').textContent = sideLabel;
      document.getElementById('settingsRoleLabel').textContent = registeredRole.role;
    }

    function changeRole() {
      localStorage.removeItem("wedding-registered-role");
      localStorage.removeItem("wedding-edit-password");
      location.reload();
    }

    function applyTheme() {
      const root = document.documentElement;
      if (registeredRole.side === 'groom') {
        root.classList.add('groom-theme');
        root.classList.remove('bride-theme');
      } else {
        root.classList.add('bride-theme');
        root.classList.remove('groom-theme');
      }
    }

    function increaseCount() {
      count++;
      document.getElementById('countDisplay').textContent = count;
    }

    function decreaseCount() {
      if (count > 1) {
        count--;
        document.getElementById('countDisplay').textContent = count;
      }
    }

    async function saveSubmission() {
      const name = document.getElementById('nameInput').value.trim();
      const contributor = `${registeredRole.side === 'groom' ? '신랑측' : '신부측'} ${registeredRole.role}`;
      const submissionId = `sub_${Date.now()}`;

      const submission = {
        id: submissionId,
        contributor,
        count,
        status: 'pending',
        personalNote: name,
        createdAt: Date.now(),
        userSide: registeredRole.side,
        userRole: registeredRole.role
      };

      if (db) {
        try {
          await db.collection("wedding/submissions").set(submissionId, submission);
          await db.collection("data/users/me/submissions").set(submissionId, submission);
        } catch (e) {
          console.error("DB save failed:", e);
          submissions.push(submission);
          saveToLocalStorage();
        }
      } else {
        submissions.push(submission);
        saveToLocalStorage();
      }

      document.getElementById('nameInput').value = '';
      count = 1;
      document.getElementById('countDisplay').textContent = '1';
      document.getElementById('nameInput').focus();

      await loadSubmissions();
      renderStats();
    }

    async function loadSubmissions() {
      if (db) {
        try {
          const result = await db.collection("wedding/submissions").orderBy({ field: "createdAt", direction: "desc" }).get();
          submissions = result.docs.map(doc => ({ id: doc.id, ...doc.data }));

          db.collection("wedding/submissions").onSnapshot((snapshot) => {
            submissions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data }));
            renderPersonalList();
            renderStats();
            if (isEditMode) {
              renderDashboardList();
              updateDashboardStats();
            }
          });
        } catch (e) {
          console.log("DB not available");
          loadFromLocalStorage();
        }
      } else {
        loadFromLocalStorage();
      }
      renderPersonalList();
    }

    function loadFromLocalStorage() {
      const saved = localStorage.getItem("wedding-submissions");
      if (saved) {
        try {
          submissions = JSON.parse(saved);
        } catch (e) {
          submissions = [];
        }
      }
    }

    function saveToLocalStorage() {
      localStorage.setItem("wedding-submissions", JSON.stringify(submissions));
    }

    function renderPersonalList() {
      const personalSection = document.getElementById('personalSection');
      const mySubmissions = submissions.filter(s =>
        s.userSide === registeredRole.side && s.userRole === registeredRole.role
      );

      if (mySubmissions.length === 0) {
        personalSection.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <div>아직 입력한 내용이 없습니다</div>
          </div>
        `;
        return;
      }

      personalSection.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>인원</th>
              <th>메모</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${mySubmissions.map(s => `
              <tr>
                <td style="font-weight: 700; font-size: 14px;">${s.count}명</td>
                <td style="font-size: 12px; color: var(--text-muted);">${s.personalNote || '—'}</td>
                <td>
                  <button class="delete-btn" onclick="deleteSubmission('${s.id}')">삭제</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderStats() {
      const total = submissions.reduce((sum, s) => sum + s.count, 0);
      const attended = submissions.filter(s => s.status === 'attended').reduce((sum, s) => sum + s.count, 0);
      const pending = submissions.filter(s => s.status === 'pending').reduce((sum, s) => sum + s.count, 0);

      document.getElementById('totalCount').textContent = total;
      document.getElementById('submitCount').textContent = submissions.length;
      document.getElementById('attendedCount').textContent = attended;
      document.getElementById('pendingCount').textContent = pending;
    }

    async function deleteSubmission(id) {
      if (!confirm('삭제하시겠습니까?')) return;

      submissions = submissions.filter(s => s.id !== id);

      if (db) {
        try {
          await db.collection("wedding/submissions").delete(id);
          await db.collection("data/users/me/submissions").delete(id).catch(() => {});
        } catch (e) {
          console.error("Delete failed:", e);
        }
      } else {
        saveToLocalStorage();
      }

      await loadSubmissions();
    }

    function goToDashboard() {
      if (registeredRole.role !== '신랑' && registeredRole.role !== '신부') {
        alert('신랑 또는 신부만 대시보드에 접근할 수 있습니다.');
        return;
      }

      document.getElementById('inputPage').style.display = 'none';
      document.getElementById('dashboardPage').style.display = 'block';
      isEditMode = false;
      document.getElementById('dashboardPassword').value = '';
      document.getElementById('dashboardPassword').focus();
    }

    function showInputPage() {
      document.getElementById('inputPage').style.display = 'block';
      document.getElementById('dashboardPage').style.display = 'none';
      isEditMode = false;
    }

    function checkDashboardPassword() {
      const password = document.getElementById('dashboardPassword').value;
      const savedPassword = localStorage.getItem("wedding-edit-password");

      if (!savedPassword) {
        if (password.length >= 4) {
          localStorage.setItem("wedding-edit-password", password);
          unlockDashboard();
        } else {
          alert('최소 4자 이상의 비밀번호를 설정해주세요.');
        }
        return;
      }

      if (password === savedPassword) {
        unlockDashboard();
      } else {
        alert('비밀번호가 맞지 않습니다.');
      }
    }

    function unlockDashboard() {
      isEditMode = true;
      document.getElementById('dashboardLocked').style.display = 'none';
      document.getElementById('dashboardUnlocked').style.display = 'block';
      switchDashboardSide('groom');
    }

    function switchDashboardSide(side) {
      currentDashboardSide = side;
      document.getElementById('dashGroomBtn').classList.toggle('active', side === 'groom');
      document.getElementById('dashBrideBtn').classList.toggle('active', side === 'bride');
      renderDashboardList();
      updateDashboardStats();
    }

    function renderDashboardList() {
      const dashboardList = document.getElementById('dashboardList');
      const sideSubmissions = submissions.filter(s => {
        const subSide = s.userSide || (s.contributor.includes('신랑측') ? 'groom' : 'bride');
        return subSide === currentDashboardSide;
      });

      if (sideSubmissions.length === 0) {
        dashboardList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📋</div>
            <div>아직 입력한 내용이 없습니다</div>
          </div>
        `;
        return;
      }

      dashboardList.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>작성자</th>
              <th>인원</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody>
            ${sideSubmissions.map(s => `
              <tr>
                <td>${s.contributor}</td>
                <td style="font-weight: 700; font-size: 14px;">${s.count}명</td>
                <td>
                  <select class="status-select" onchange="updateStatus('${s.id}', this.value)">
                    <option value="pending" ${s.status === 'pending' ? 'selected' : ''}>미응답</option>
                    <option value="attended" ${s.status === 'attended' ? 'selected' : ''}>참석</option>
                    <option value="declined" ${s.status === 'declined' ? 'selected' : ''}>불참</option>
                  </select>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function updateDashboardStats() {
      const sideSubmissions = submissions.filter(s => {
        const subSide = s.userSide || (s.contributor.includes('신랑측') ? 'groom' : 'bride');
        return subSide === currentDashboardSide;
      });

      const total = sideSubmissions.reduce((sum, s) => sum + s.count, 0);
      const attended = sideSubmissions.filter(s => s.status === 'attended').reduce((sum, s) => sum + s.count, 0);
      const pending = sideSubmissions.filter(s => s.status === 'pending').reduce((sum, s) => sum + s.count, 0);

      document.getElementById('dashTotal').textContent = total;
      document.getElementById('dashSubmitCount').textContent = sideSubmissions.length;
      document.getElementById('dashAttended').textContent = attended;
      document.getElementById('dashPending').textContent = pending;
    }

    async function updateStatus(id, status) {
      const submission = submissions.find(s => s.id === id);
      if (!submission) return;

      submission.status = status;

      if (db) {
        try {
          await db.collection("wedding/submissions").update(id, { status });
        } catch (e) {
          console.error("Update failed:", e);
        }
      } else {
        saveToLocalStorage();
        renderDashboardList();
        updateDashboardStats();
      }
    }

    init();

    // 요소가 존재할 때만 이벤트 리스너 추가
    document.addEventListener('DOMContentLoaded', () => {
      const nameInput = document.getElementById('nameInput');
      const dashPassword = document.getElementById('dashboardPassword');

      if (nameInput) {
        nameInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') saveSubmission();
        });
      }

      if (dashPassword) {
        dashPassword.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') checkDashboardPassword();
        });
      }
    });
  </script>
</body>
</html>
